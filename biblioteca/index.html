<script>
(function(){
"use strict";
const DATA = JSON.parse(document.getElementById('data').textContent);
const CATS = DATA.cats;
const HUES = {geo:150,eco:60,fin:95,hum:30,sci:250,psy:300,self:15,health:130,lead:220,comm:340,bio:75,phil:280};
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fold = s => String(s).normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();

// ---------- storage ----------
const KEY = 'biblioteca.v1';
let store = {notes:[], books:[], edits:{}, last:null, size:18};
try { const raw = localStorage.getItem(KEY); if (raw) store = Object.assign(store, JSON.parse(raw)); } catch(e){}
store.edits = store.edits || {}; store.books = store.books || []; store.notes = store.notes || [];
function save(){ try { localStorage.setItem(KEY, JSON.stringify(store)); } catch(e){ toast('Salvataggio non riuscito: memoria del browser non disponibile'); } }
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch(e){}
document.documentElement.style.setProperty('--read-size', store.size + 'px');

// ---------- book model ----------
let BOOKS = [];
const blocksOf = b => store.edits[b.id] || b.b;
function reindex(b){
  const bl = blocksOf(b);
  b._plain = bl.map(x => x[0] === 'my' ? (x[2] ? x[2] + ' ' : '') + x[1] : x[1]).join('\n');
  b._txt = fold(b._plain);
  b._head = fold(b.t + ' ' + (b.a||'') + ' ' + (b.alt||''));
  b._words = bl.filter(x => x[0] !== 'my').map(x => x[1]).join(' ').split(/\s+/).length;
  b._notes = bl.filter(x => x[0] === 'my').length;
}
function rebuild(){ BOOKS = DATA.books.concat(store.books); BOOKS.forEach(reindex); }
// one-time migration: loose notes from v1 become inline notes at the end of their book
function migrate(){
  if (!store.notes.length) return;
  rebuild();
  store.notes.forEach(n => {
    const b = BOOKS.find(x => x.id === n.book); if (!b) return;
    const bl = blocksOf(b).slice(); bl.push(['my', n.text || '', n.quote || '', n.ts || Date.now()]);
    store.edits[b.id] = bl;
  });
  store.notes = []; save();
}
migrate(); rebuild();
const byId = id => BOOKS.find(b => b.id === id);
const minutes = b => Math.max(1, Math.round(b._words / 220));
const totalNotes = () => BOOKS.reduce((n, b) => n + b._notes, 0);
const isUser = id => store.books.some(x => x.id === id);
function setBlocks(b, bl){
  if (isUser(b.id)){ store.books.find(x => x.id === b.id).b = bl; delete store.edits[b.id]; b.b = bl; }
  else store.edits[b.id] = bl;
  reindex(b); save();
}

// ---------- render content ----------
function renderBlocks(blocks){
  let html = '', i = 0, hi = 0;
  const toc = [];
  while (i < blocks.length){
    const [t, s] = blocks[i];
    if (t === 'li'){
      let items = '';
      while (i < blocks.length && (blocks[i][0] === 'li' || (blocks[i][0] === 'gap' && blocks[i+1] && blocks[i+1][0] === 'li'))){
        if (blocks[i][0] === 'li') items += '<li>' + esc(blocks[i][1]) + '</li>';
        i++;
      }
      html += '<ul data-bi="' + (i-1) + '">' + items + '</ul>'; continue;
    }
    if (t === 'p'){
      const parts = [];
      while (i < blocks.length && blocks[i][0] === 'p'){ parts.push(esc(blocks[i][1])); i++; }
      html += '<p data-bi="' + (i-1) + '">' + parts.join('<br>') + '</p>'; continue;
    }
    if (t === 'h'){
      const id = 'h' + (hi++);
      const lead = /^tesi centrale/i.test(s.replace(/^[^\p{L}]+/u,''));
      toc.push({id, s});
      html += '<h3 id="' + id + '" data-bi="' + i + '"' + (lead ? ' class="lead"' : '') + '>' + esc(s) + '</h3>';
    }
    else if (t === 'pt') html += '<p class="pt" data-bi="' + i + '">' + esc(s) + '</p>';
    else if (t === 'key') html += '<p class="key" data-bi="' + i + '">📌 ' + esc(s) + '</p>';
    else if (t === 'hr') html += '<hr>';
    else if (t === 'my') html += '<aside class="mynote" data-bi="' + i + '" data-my="' + i + '">' + (blocks[i][2] ? '<span class="q">«' + esc(blocks[i][2]) + '»</span>' : '') + esc(s) + (blocks[i][3] ? '<span class="d">' + fmtDate(blocks[i][3]) + '</span>' : '') + '</aside>';
    i++;
  }
  return {html, toc};
}

// ---------- text <-> blocks ----------
function serialize(bl){
  return bl.map(([t, s, q]) => {
    if (t === 'h') return '## ' + s;
    if (t === 'li') return '• ' + s;
    if (t === 'pt') return '👉 ' + s;
    if (t === 'key') return '📌 ' + s;
    if (t === 'hr') return '⸻';
    if (t === 'gap') return '';
    if (t === 'my') return '✍️ ' + (q ? '«' + q + '» ' : '') + String(s).replace(/\n/g, ' ¶ ');
    return s;
  }).join('\n');
}
function parseText(raw, old){
  const dates = {}; (old||[]).forEach(x => { if (x[0] === 'my') dates[x[1]] = x[3]; });
  const out = [];
  raw.replace(/\r/g,'').split('\n').forEach(l => {
    const s = l.trim();
    if (!s){ if (out.length && out[out.length-1][0] !== 'gap') out.push(['gap','']); return; }
    const my = s.match(/^✍️?\s*(?:«([^»]*)»\s*)?([\s\S]*)$/u);
    if (s.startsWith('✍') && my){ const txt = my[2].replace(/ ¶ /g, '\n'); return out.push(['my', txt, my[1] || '', dates[txt] || Date.now()]); }
    if (/^[⸻—_\-]{2,}$|^⸻$/.test(s)) return out.push(['hr','']);
    if (/^[•\-\*·]\s*/.test(s) && s.length > 2) return out.push(['li', s.replace(/^[•\-\*·]\s*/,'')]);
    const kc = s.match(/^(\d+)\s*️?⃣\s*/); if (kc) return out.push(['h', kc[1] + '. ' + s.slice(kc[0].length)]);
    if (s.startsWith('📌')) return out.push(['key', s.replace(/^📌\s*/,'')]);
    if (s.startsWith('👉')) return out.push(['pt', s.replace(/^👉\s*/,'')]);
    if (/^#{1,3}\s/.test(s)) return out.push(['h', s.replace(/^#+\s*/,'')]);
    if (/^\p{Extended_Pictographic}/u.test(s) && s.length < 80 && !/\.$/.test(s)) return out.push(['h', s]);
    if (/^\d{1,2}[\.\)]\s+\S/.test(s) && s.length < 70 && !/\.$/.test(s)) return out.push(['h', s]);
    out.push(['p', s]);
  });
  while (out.length && out[out.length-1][0] === 'gap') out.pop();
  return out;
}

// ---------- library views ----------
let cat = 'all', view = 'lib', current = null;
function catChip(k, label, n){
  const h = HUES[k] || 200;
  return '<button class="chip' + (k==='all'?' all':'') + '" style="--h:' + h + '" data-cat="' + k + '" aria-pressed="' + (cat===k) + '">' +
    (k==='all' ? '' : '<span class="cat-dot" style="--h:' + h + '"></span>') + esc(label) + ' <span class="n">' + n + '</span></button>';
}
function renderChips(){
  const counts = {}; BOOKS.forEach(b => counts[b.c] = (counts[b.c]||0) + 1);
  let h = catChip('all', 'Tutti', BOOKS.length);
  Object.keys(CATS).forEach(k => { if (counts[k]) h += catChip(k, CATS[k].n, counts[k]); });
  $('#chips').innerHTML = h;
  const n = totalNotes();
  $('#count').textContent = BOOKS.length + ' libri · ' + n + (n === 1 ? ' nota' : ' note');
}
$('#chips').addEventListener('click', e => {
  const b = e.target.closest('.chip'); if (!b) return;
  cat = b.dataset.cat; renderChips(); renderHome();
});
function row(b, extra, badge){
  return '<li><button class="row" data-open="' + b.id + '"><span class="cat-dot" style="--h:' + (HUES[b.c]||200) + '"></span><span class="main"><span class="t">' + esc(b.t) + '</span><span class="a">' + esc(b.a || '—') + '</span>' + (extra||'') + '</span>' +
    '<span class="meta">' + (badge||'') + (b._notes ? '<span title="Note">✍️ ' + b._notes + '</span>' : '') + minutes(b) + ' min</span></button></li>';
}
function renderHome(){
  const q = $('#q').value.trim();
  $('#qclear').hidden = !q;
  if (q) return renderSearch(q);
  let h = '';
  if (cat === 'all' && store.last && byId(store.last.id)){
    const b = byId(store.last.id);
    h += '<button class="continue" data-open="' + b.id + '" data-resume="1"><span><span class="lbl">Continua a leggere</span><br><span class="t">' + esc(b.t) + '</span></span><span class="arrow">›</span></button>';
  }
  Object.keys(CATS).forEach(k => {
    if (cat !== 'all' && cat !== k) return;
    const list = BOOKS.filter(b => b.c === k).sort((a,b) => a.t.localeCompare(b.t));
    if (!list.length) return;
    h += '<section class="shelf"><h2><span class="cat-dot" style="--h:' + HUES[k] + '"></span>' + esc(CATS[k].n) + '<span class="n">' + list.length + '</span></h2><ul class="list">' + list.map(b => row(b)).join('') + '</ul></section>';
  });
  $('#home').innerHTML = h;
}
function terms(q){ return fold(q).split(/\s+/).filter(t => t.length > 1 || /\d/.test(t)); }
function countOcc(hay, t){ let n = 0, i = 0; while ((i = hay.indexOf(t, i)) !== -1){ n++; i += t.length; } return n; }
function highlight(text, ts){
  const f = fold(text); const marks = [];
  ts.forEach(t => { let i = 0; while ((i = f.indexOf(t, i)) !== -1){ marks.push([i, i + t.length]); i += t.length; } });
  if (!marks.length) return esc(text);
  marks.sort((a,b) => a[0]-b[0]);
  let out = '', pos = 0;
  marks.forEach(([s,e]) => { if (s < pos) return; out += esc(text.slice(pos, s)) + '<mark>' + esc(text.slice(s, e)) + '</mark>'; pos = e; });
  return out + esc(text.slice(pos));
}
function snippet(b, ts){
  const i = b._txt.indexOf(ts[0]); if (i < 0) return '';
  const s = Math.max(0, i - 60), e = Math.min(b._plain.length, i + 110);
  let t = b._plain.slice(s, e).replace(/\s+/g, ' ');
  if (s > 0) t = t.replace(/^\S*\s/, '');
  if (e < b._plain.length) t = t.replace(/\s\S*$/, '');
  return (s > 0 ? '…' : '') + highlight(t, ts) + (e < b._plain.length ? '…' : '');
}
function renderSearch(q){
  const ts = terms(q);
  if (!ts.length){ $('#home').innerHTML = ''; return; }
  const res = [];
  BOOKS.forEach(b => {
    if (cat !== 'all' && b.c !== cat) return;
    const inHead = ts.every(t => b._head.includes(t));
    const inBody = ts.every(t => b._txt.includes(t) || b._head.includes(t));
    if (!inHead && !inBody) return;
    const occ = ts.reduce((n,t) => n + countOcc(b._txt, t), 0);
    res.push({b, score: (inHead ? 1e6 : 0) + occ, occ});
  });
  res.sort((a,b) => b.score - a.score);
  let h = '<div class="res-head"><span>' + res.length + (res.length === 1 ? ' libro' : ' libri') + '</span><span>' + (cat==='all' ? 'in tutte le categorie' : esc(CATS[cat].n)) + '</span></div>';
  if (!res.length) h += '<p class="empty">Nessun risultato per “' + esc(q) + '”.<br>Prova con una parola sola o senza accenti.</p>';
  h += '<ul class="list">' + res.slice(0, 150).map(r => row(r.b, r.occ ? '<span class="snip">' + snippet(r.b, ts) + '</span>' : '', r.occ ? '<span class="badge">' + r.occ + '×</span>' : '')).join('') + '</ul>';
  $('#home').innerHTML = h;
}

// ---------- reader ----------
let findTerms = [], findIdx = 0, annot = false, editing = false;
function readerHTML(b){
  const {html, toc} = renderBlocks(blocksOf(b));
  const h = HUES[b.c] || 200;
  const edited = !!store.edits[b.id] && !isUser(b.id);
  return '<div class="rbar"><div class="wrap">' +
      '<button class="icon-btn" id="back" aria-label="Torna alla libreria">‹ Libreria</button><span class="sp"></span>' +
      '<span class="aa"><button class="icon-btn" id="fsm" aria-label="Testo più piccolo">A−</button><button class="icon-btn" id="fsp" aria-label="Testo più grande">A+</button></span>' +
      '<button class="icon-btn" id="annot" aria-pressed="' + annot + '">✍️ Annota</button>' +
      '<button class="icon-btn" id="edit">Modifica</button>' +
    '</div><div class="progress" id="prog"></div></div>' +
    '<div class="wrap"><header class="rhead"><span class="cat" style="--h:' + h + '"><span class="cat-dot" style="--h:' + h + '"></span>' + esc(CATS[b.c] ? CATS[b.c].n : '') + '</span>' +
      '<h1>' + esc(b.t) + '</h1><div class="by">' + esc(b.a || '') + '</div>' +
      '<div class="facts"><span>' + minutes(b) + ' min di lettura</span>' + (b.pg ? '<span>PDF p. ' + b.pg + '</span>' : b.ad ? '<span>Aggiunto il ' + fmtDate(b.ad) + '</span>' : '<span>Aggiunto da te</span>') +
        (b._notes ? '<span>✍️ ' + b._notes + (b._notes === 1 ? ' nota' : ' note') + '</span>' : '') + (edited ? '<span class="edited">Modificato da te</span>' : '') + '</div>' +
      (toc.length > 3 ? '<details class="toc"><summary>Indice <span>▾</span></summary><ol>' + toc.map(t => '<li><a href="#' + t.id + '" data-jump="' + t.id + '">' + esc(t.s) + '</a></li>').join('') + '</ol></details>' : '') +
    '</header><div class="content" id="content">' + html + '</div></div>';
}
function openBook(id, opts){
  const b = byId(id); if (!b) return;
  current = b; opts = opts || {}; editing = false;
  if (!opts.keepAnnot) annot = false;
  $('#reader').innerHTML = readerHTML(b);
  document.body.className = 'reading' + (annot ? ' annot' : '');
  setTab('lib');
  findTerms = opts.terms || [];
  if (findTerms.length) markFind(); else removeFind();
  if (annot) showAnnotHint();
  if (opts.bi != null){ requestAnimationFrame(() => scrollToBlock(opts.bi, true)); }
  else if (opts.y != null) requestAnimationFrame(() => window.scrollTo(0, opts.y));
  else if (opts.resume && store.last && store.last.id === id) requestAnimationFrame(() => window.scrollTo(0, store.last.y || 0));
  else if (!findTerms.length) window.scrollTo(0, 0);
  if (location.hash !== '#' + id) history.pushState(null, '', '#' + id);
  store.last = {id, y: store.last && store.last.id === id ? store.last.y : 0}; save();
}
function rerender(){ if (current) openBook(current.id, {y: window.scrollY, keepAnnot: true}); }
function scrollToBlock(bi, flash){
  const el = document.querySelector('#content [data-bi="' + bi + '"]'); if (!el) return;
  window.scrollTo({top: el.getBoundingClientRect().top + window.scrollY - window.innerHeight * 0.3});
  if (flash && el.classList.contains('mynote')){ el.classList.add('flash'); setTimeout(() => el.classList.remove('flash'), 1500); }
}
function closeBook(){
  current = null; annot = false; editing = false;
  removeFind(); hideSel(); closeSheet();
  document.body.className = view === 'lib' ? '' : 'v-' + view;
  if (location.hash) history.pushState(null, '', location.pathname + location.search);
  renderChips(); renderHome();
}
function markFind(){
  const c = $('#content'); if (!c) return;
  const walker = document.createTreeWalker(c, NodeFilter.SHOW_TEXT);
  const nodes = []; while (walker.nextNode()) nodes.push(walker.currentNode);
  nodes.forEach(n => {
    const h = highlight(n.nodeValue, findTerms);
    if (h.indexOf('<mark>') >= 0){ const span = document.createElement('span'); span.innerHTML = h; n.replaceWith(span); }
  });
  const ms = c.querySelectorAll('mark');
  if (!ms.length){ removeFind(); return; }
  findIdx = 0;
  bar('<span id="findlbl">1 di ' + ms.length + '</span><button id="fprev" aria-label="Precedente">↑</button><button id="fnext" aria-label="Successivo">↓</button><button id="fclose" aria-label="Chiudi">×</button>');
  gotoMark();
}
function gotoMark(){
  const ms = $('#content').querySelectorAll('mark');
  ms.forEach(m => m.classList.remove('cur'));
  const m = ms[findIdx]; if (!m) return;
  m.classList.add('cur');
  window.scrollTo({top: m.getBoundingClientRect().top + window.scrollY - window.innerHeight * 0.35});
  const lbl = document.getElementById('findlbl'); if (lbl) lbl.textContent = (findIdx + 1) + ' di ' + ms.length;
}
function bar(inner){
  removeFind();
  const d = document.createElement('div'); d.className = 'findbar'; d.id = 'findbar';
  d.innerHTML = '<div class="in">' + inner + '</div>';
  document.body.appendChild(d);
}
function removeFind(){ const f = document.getElementById('findbar'); if (f) f.remove(); }
function showAnnotHint(){ bar('<span>Tocca un paragrafo per scriverci sotto una nota</span><button id="annotdone">Fine</button>'); }
function setAnnot(on){
  annot = on; document.body.classList.toggle('annot', on);
  const b = document.getElementById('annot'); if (b) b.setAttribute('aria-pressed', String(on));
  if (on) showAnnotHint(); else removeFind();
}

// ---------- editor ----------
function openEditor(){
  const b = current; editing = true; setAnnot(false); hideSel();
  const hasOrig = !!store.edits[b.id] && !isUser(b.id);
  const c = $('#content');
  c.outerHTML = '<div class="editor" id="content"><p class="help">Modifica liberamente. Righe che iniziano con <code>##</code> = titolo di sezione, <code>•</code> = elenco, <code>👉</code> = punto chiave, <code>📌</code> = riquadro, <code>✍️</code> = tua nota, <code>⸻</code> = separatore. Riga vuota = nuovo paragrafo.</p>' +
    '<textarea id="edtext" spellcheck="true" aria-label="Testo del riassunto">' + esc(serialize(blocksOf(b))) + '</textarea>' +
    '<div class="actions">' + (hasOrig ? '<button class="btn danger" id="edreset">Ripristina originale</button>' : '') + (isUser(b.id) ? '<button class="btn danger" id="delbook">Elimina libro</button>' : '') +
    '<button class="btn ghost" id="edcancel">Annulla</button><button class="btn" id="edsave">Salva modifiche</button></div></div>';
  const e = document.getElementById('edit'); if (e) e.hidden = true;
  const a = document.getElementById('annot'); if (a) a.hidden = true;
  window.scrollTo(0, $('.rhead').offsetTop + $('.rhead').offsetHeight - 70);
}

// ---------- note sheet ----------
let sheetCtx = null;
function openNoteSheet(ctx){
  // ctx: {after: blockIndex, quote} for new; {edit: blockIndex} for existing
  closeSheet(); sheetCtx = ctx;
  const bl = blocksOf(current);
  const ex = ctx.edit != null ? bl[ctx.edit] : null;
  const quote = ex ? ex[2] : (ctx.quote || '');
  let context = '';
  if (!ex && !quote && ctx.after != null){ const el = document.querySelector('#content [data-bi="' + ctx.after + '"]'); if (el) context = el.textContent.slice(0, 220); }
  const bg = document.createElement('div'); bg.className = 'sheet-bg'; bg.id = 'sheetbg'; bg.addEventListener('click', closeSheet);
  const sh = document.createElement('section'); sh.className = 'sheet'; sh.id = 'sheet'; sh.setAttribute('role', 'dialog'); sh.setAttribute('aria-label', 'Nota');
  sh.innerHTML = '<div class="wrap"><header><h2>' + (ex ? 'Modifica nota' : 'Nuova nota') + '</h2><button class="icon-btn" id="sclose">Chiudi</button></header></div>' +
    '<div class="body"><div class="wrap">' +
    (quote ? '<div class="note" style="border:0;padding-top:0"><blockquote>' + esc(quote) + '</blockquote></div>' : '') +
    (context ? '<p class="ctx">' + esc(context) + '</p>' : '') +
    '<textarea id="ntext" placeholder="Il tuo pensiero, una correzione, un collegamento con un altro libro…">' + esc(ex ? ex[1] : '') + '</textarea>' +
    '<div class="actions">' + (ex ? '<button class="btn danger" id="ndel">Elimina nota</button>' : '') + '<button class="btn" id="nsave">' + (ex ? 'Salva' : 'Inserisci nel testo') + '</button></div></div></div>';
  document.body.appendChild(bg); document.body.appendChild(sh);
  sh.querySelector('#sclose').addEventListener('click', closeSheet);
  sh.querySelector('#nsave').addEventListener('click', () => {
    const text = sh.querySelector('#ntext').value.trim();
    if (!text && !quote){ toast('Scrivi qualcosa prima di salvare'); return; }
    const nb = blocksOf(current).slice(); let target;
    if (ex){ nb[ctx.edit] = ['my', text, quote, ex[3] || Date.now()]; target = ctx.edit; }
    else { target = ctx.after + 1; nb.splice(target, 0, ['my', text, quote, Date.now()]); }
    setBlocks(current, nb); closeSheet(); const y = window.scrollY; openBook(current.id, {y, keepAnnot: true});
    toast(ex ? 'Nota aggiornata' : 'Nota inserita'); setTimeout(() => scrollToBlock(target, true), 60);
  });
  const del = sh.querySelector('#ndel');
  if (del) del.addEventListener('click', () => {
    if (!del.dataset.armed){ del.dataset.armed = '1'; del.textContent = 'Tocca di nuovo per eliminare'; return; }
    const nb = blocksOf(current).slice(); nb.splice(ctx.edit, 1); setBlocks(current, nb); closeSheet(); rerender(); toast('Nota eliminata');
  });
  setTimeout(() => sh.querySelector('#ntext').focus(), 60);
}
function closeSheet(){ ['sheet','sheetbg'].forEach(id => { const el = document.getElementById(id); if (el) el.remove(); }); }

// ---------- clicks ----------
document.addEventListener('click', e => {
  const t = e.target;
  const op = t.closest('[data-open]');
  if (op){
    const q = $('#q').value.trim();
    openBook(op.dataset.open, {resume: !!op.dataset.resume, terms: (q && !op.dataset.resume) ? terms(q) : []});
    return;
  }
  const gn = t.closest('[data-gonote]');
  if (gn){ openBook(gn.dataset.book, {bi: +gn.dataset.gonote}); return; }
  const j = t.closest('[data-jump]');
  if (j){ e.preventDefault(); const el = document.getElementById(j.dataset.jump); if (el) window.scrollTo({top: el.getBoundingClientRect().top + window.scrollY - 70}); return; }
  if (t.closest('#back')) return closeBook();
  if (t.closest('#fsp') || t.closest('#fsm')){
    store.size = Math.min(26, Math.max(14, store.size + (t.closest('#fsp') ? 1 : -1)));
    document.documentElement.style.setProperty('--read-size', store.size + 'px'); save(); return;
  }
  if (t.closest('#annot')) return setAnnot(!annot);
  if (t.closest('#annotdone')) return setAnnot(false);
  if (t.closest('#edit')) return openEditor();
  if (t.closest('#edcancel')) return rerender();
  if (t.closest('#edsave')){
    const nb = parseText($('#edtext').value, blocksOf(current));
    if (!nb.length){ toast('Il testo è vuoto: non salvo'); return; }
    setBlocks(current, nb); rerender(); toast('Modifiche salvate'); return;
  }
  const rs = t.closest('#edreset');
  if (rs){
    if (!rs.dataset.armed){ rs.dataset.armed = '1'; rs.textContent = 'Tocca di nuovo: perdi modifiche e note'; return; }
    delete current.edits; delete store.edits[current.id]; reindex(current); save(); rerender(); toast('Testo originale ripristinato'); return;
  }
  const db = t.closest('#delbook');
  if (db){
    if (!db.dataset.armed){ db.dataset.armed = '1'; db.textContent = 'Tocca di nuovo per eliminare'; return; }
    store.books = store.books.filter(x => x.id !== current.id); save(); rebuild(); closeBook(); toast('Libro eliminato'); return;
  }
  if (t.closest('#fnext') || t.closest('#fprev')){
    const n = $('#content').querySelectorAll('mark').length;
    findIdx = (findIdx + (t.closest('#fnext') ? 1 : -1) + n) % n; gotoMark(); return;
  }
  if (t.closest('#fclose')){ removeFind(); return; }
  // inside the text
  if (current && !editing){
    const my = t.closest('#content [data-my]');
    if (my){ openNoteSheet({edit: +my.dataset.my}); return; }
    if (annot){
      const blk = t.closest('#content [data-bi]');
      if (blk){ openNoteSheet({after: +blk.dataset.bi}); return; }
    }
  }
});

// progress + remember position
let saveT;
window.addEventListener('scroll', () => {
  $('#top').classList.toggle('scrolled', window.scrollY > 4);
  if (!current || editing) return;
  const max = document.documentElement.scrollHeight - window.innerHeight;
  const p = document.getElementById('prog'); if (p) p.style.width = (max > 0 ? Math.min(100, window.scrollY / max * 100) : 0) + '%';
  clearTimeout(saveT); saveT = setTimeout(() => { if (current){ store.last = {id: current.id, y: window.scrollY}; save(); } }, 400);
}, {passive: true});

// ---------- selection → note in the text ----------
let selBtn = null, selText = '', selBi = null;
function hideSel(){ if (selBtn){ selBtn.remove(); selBtn = null; } }
document.addEventListener('selectionchange', () => {
  if (!current || editing) return hideSel();
  const s = document.getSelection(); const txt = s ? s.toString().trim() : '';
  const c = document.getElementById('content');
  if (!txt || txt.length < 3 || !s.anchorNode || !c || !c.contains(s.anchorNode)) return hideSel();
  const fo = s.focusNode && (s.focusNode.nodeType === 1 ? s.focusNode : s.focusNode.parentElement);
  const blk = fo && fo.closest('[data-bi]'); if (!blk) return hideSel();
  selText = txt.replace(/\s+/g, ' '); selBi = +blk.dataset.bi;
  if (!selBtn){
    selBtn = document.createElement('button'); selBtn.className = 'selsave'; selBtn.textContent = '✍️ Nota su questa frase';
    selBtn.addEventListener('mousedown', e => e.preventDefault());
    selBtn.addEventListener('click', () => { const q = selText, at = selBi; hideSel(); try { document.getSelection().removeAllRanges(); } catch(e){} openNoteSheet({after: at, quote: q}); });
    document.body.appendChild(selBtn);
  }
});

// ---------- notes view ----------
function fmtDate(ts){ try { return new Date(ts).toLocaleDateString('it-IT', {day:'numeric', month:'short', year:'numeric'}); } catch(e){ return ''; } }
function renderNotesView(){
  const all = [];
  BOOKS.forEach(b => blocksOf(b).forEach((x, i) => { if (x[0] === 'my') all.push({b, i, text: x[1], quote: x[2], ts: x[3] || 0}); }));
  all.sort((a, b) => b.ts - a.ts);
  const edited = Object.keys(store.edits).filter(id => byId(id)).length;
  let h = '<h2 class="vh">Le mie note</h2><p class="lede">Tutte le note che hai scritto dentro i riassunti, dalla più recente. Tocca una nota per ritrovarla nel testo.</p>';
  if (!all.length) h += '<p class="empty">Non hai ancora note.<br>Apri un riassunto, tocca <b>✍️ Annota</b> e poi il paragrafo dove vuoi scrivere.<br>Oppure seleziona una frase.</p>';
  h += all.map(n => '<div class="note"><button class="book" data-gonote="' + n.i + '" data-book="' + n.b.id + '">' + esc(n.b.t) + ' ›</button>' +
    (n.quote ? '<blockquote>' + esc(n.quote) + '</blockquote>' : '') + (n.text ? '<div class="txt">' + esc(n.text) + '</div>' : '') +
    '<div class="when"><span>' + (n.ts ? fmtDate(n.ts) : '') + '</span></div></div>').join('');
  h += backupCard(edited);
  $('#notesview').innerHTML = h;
  bindBackup();
}

// ---------- backup ----------
function backupCard(edited){
  const n = totalNotes();
  return '<div class="card"><h3>Backup</h3><p>Note, modifiche e libri aggiunti vivono solo su questo telefono (ora: ' + n + ' note, ' + (edited != null ? edited : Object.keys(store.edits).length) + ' riassunti modificati, ' + store.books.length + ' libri aggiunti). Salva un backup ogni tanto e conservalo al sicuro, per esempio in Note o su iCloud Drive.</p>' +
    '<div class="actions" style="justify-content:flex-start"><button class="btn ghost" id="bcopy">Copia backup</button>' + (/claude/.test(location.hostname) ? '' : '<button class="btn ghost" id="bfile">Salva file</button>') + '<button class="btn ghost" id="bshow">Ripristina…</button></div>' +
    '<div id="brestore" hidden><textarea id="bin" placeholder="Incolla qui il testo del backup"></textarea><div class="actions"><label class="btn ghost" for="bpick">Scegli file</label><input type="file" id="bpick" accept=".json,application/json,text/plain" hidden><button class="btn" id="bdo">Ripristina</button></div></div></div>';
}
function backupJSON(){ return JSON.stringify({app:'biblioteca', v:2, date:new Date().toISOString(), edits:store.edits, books:store.books.map(b => ({id:b.id,t:b.t,a:b.a,c:b.c,b:b.b}))}); }
function bindBackup(){
  const c = document.getElementById('bcopy'); if (!c) return;
  c.addEventListener('click', () => {
    const txt = backupJSON();
    const fallback = () => { document.getElementById('brestore').hidden = false; const ta = document.getElementById('bin'); ta.value = txt; ta.select(); toast('Seleziona e copia il testo'); };
    try { navigator.clipboard.writeText(txt).then(() => toast('Backup copiato'), fallback); } catch(e){ fallback(); }
  });
  const bf = document.getElementById('bfile');
  if (bf) bf.addEventListener('click', async () => {
    const name = 'biblioteca-backup-' + new Date().toISOString().slice(0,10) + '.json';
    const blob = new Blob([backupJSON()], {type:'application/json'});
    try {
      const file = new File([blob], name, {type:'application/json'});
      if (navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file], title:'Backup My Library'}); return; }
    } catch(e){ if (e && e.name === 'AbortError') return; }
    try { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove(); }
    catch(e){ toast('Salvataggio file non disponibile: usa “Copia backup”'); }
  });
  document.getElementById('bshow').addEventListener('click', () => { document.getElementById('brestore').hidden = false; });
  document.getElementById('bpick').addEventListener('change', e => { const f = e.target.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => { document.getElementById('bin').value = r.result; }; r.readAsText(f); });
  document.getElementById('bdo').addEventListener('click', () => {
    try {
      const d = JSON.parse(document.getElementById('bin').value);
      if (!d || d.app !== 'biblioteca') throw 0;
      let ne = 0, nb = 0;
      Object.keys(d.edits || {}).forEach(id => { store.edits[id] = d.edits[id]; ne++; });
      const ids = new Set(store.books.map(b => b.id));
      (d.books || []).forEach(b => { if (!ids.has(b.id)){ store.books.push(b); nb++; } });
      (d.notes || []).forEach(n => store.notes.push(n));
      save(); migrate(); rebuild(); renderChips(); renderNotesView();
      toast('Ripristinati ' + ne + ' riassunti' + (nb ? ' e ' + nb + ' libri' : ''));
    } catch(e){ toast('Il testo incollato non è un backup valido'); }
  });
}

// ---------- add book ----------
function renderAddView(){
  const opts = Object.keys(CATS).map(k => '<option value="' + k + '">' + esc(CATS[k].n) + '</option>').join('');
  $('#addview').innerHTML = '<h2 class="vh">Aggiungi un libro</h2><p class="lede">Incolla il riassunto così com’è: elenchi con •, titoli con 1️⃣ 2️⃣, frasi con 👉 e 📌 vengono riconosciuti.</p>' +
    '<form id="addform" novalidate>' +
    '<div class="field"><label for="at">Titolo</label><input class="f" id="at" required></div>' +
    '<div class="field"><label for="aa">Autore</label><input class="f" id="aa"></div>' +
    '<div class="field"><label for="ac">Categoria</label><select class="f" id="ac">' + opts + '</select></div>' +
    '<div class="field"><label for="ax">Riassunto</label><textarea id="ax" style="min-height:220px" placeholder="🎯 Tesi centrale&#10;…"></textarea></div>' +
    '<div class="actions"><button class="btn" type="submit">Salva nella libreria</button></div></form>' + backupCard();
  bindBackup();
  $('#addform').addEventListener('submit', e => {
    e.preventDefault();
    const t = $('#at').value.trim(), x = $('#ax').value.trim();
    if (!t || !x){ toast('Servono almeno titolo e riassunto'); return; }
    const b = {id: 'u' + Date.now().toString(36), t, a: $('#aa').value.trim(), c: $('#ac').value, b: parseText(x)};
    store.books.push(b); save(); rebuild(); renderChips();
    toast('Aggiunto: ' + t); openBook(b.id);
  });
}

// ---------- tabs / routing ----------
function setTab(v){ ['lib','notes','add'].forEach(k => document.getElementById('tab-' + k).setAttribute('aria-current', String(k === v))); }
function go(v){
  view = v; current = null; annot = false; editing = false; removeFind(); hideSel(); closeSheet();
  document.body.className = v === 'lib' ? '' : 'v-' + v;
  $('#vtitle').textContent = v === 'lib' ? 'My Library' : v === 'notes' ? 'Note' : 'Nuovo libro';
  setTab(v);
  if (v === 'notes') renderNotesView();
  if (v === 'add') renderAddView();
  if (v === 'lib'){ renderChips(); renderHome(); }
  window.scrollTo(0, 0);
  const want = v === 'lib' ? '' : '#' + v;
  if (location.hash !== want) history.pushState(null, '', want || (location.pathname + location.search));
}
$('#tab-lib').addEventListener('click', () => { if (current) closeBook(); go('lib'); });
$('#tab-notes').addEventListener('click', () => go('notes'));
$('#tab-add').addEventListener('click', () => go('add'));
function route(){
  const h = location.hash.slice(1);
  if (h && byId(h)){ if (!current || current.id !== h) openBook(h, {resume: true}); }
  else if (h === 'notes' || h === 'add') go(h);
  else if (/^h\d+$/.test(h) && current){ /* in-page jump */ }
  else { if (current) closeBook(); else go('lib'); }
}
window.addEventListener('popstate', route);

let qT;
$('#q').addEventListener('input', () => { clearTimeout(qT); qT = setTimeout(renderHome, 120); });
$('#qclear').addEventListener('click', () => { $('#q').value = ''; renderHome(); $('#q').focus(); });

let toastT;
function toast(msg){
  let t = document.getElementById('toast');
  if (!t){ t = document.createElement('div'); t.className = 'toast'; t.id = 'toast'; t.setAttribute('role', 'status'); document.body.appendChild(t); }
  t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, 2200);
}

renderChips(); renderHome(); route();

// offline support when installed from its own web address
try { if ('serviceWorker' in navigator && !/claude/.test(location.hostname)) navigator.serviceWorker.register('sw.js').catch(() => {}); } catch(e){}
})();
</script>
